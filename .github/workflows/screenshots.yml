# Manual: captures review screenshots of the built app into the "screenshots" branch.
name: Review screenshots
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          npx vite preview --port 4180 --strictPort &
          for i in $(seq 1 30); do curl -sf http://localhost:4180/ >/dev/null && break; sleep 1; done
          OUT=/tmp/shots node e2e/screens.mjs
      - name: Publish to screenshots branch
        run: |
          cd /tmp/shots
          git init -q -b screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "Screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" screenshots
